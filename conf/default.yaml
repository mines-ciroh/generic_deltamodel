# Default Master Configuration
#
# this is a template and will not run unless modified.
# See ./docs/configuration.md for definitions and options.

defaults:
  - _self_
  - hydra: settings
  - observations: none

name: ${model.nn.name}-${model.phy.name}
exp_name: null


## General -------------------------------#
mode: train
multimodel_type: none
seed: 111111
logging: none
cache_states: False
device: cuda
gpu_id: 0

data_loader: NoneLoader
data_sampler: NoneSampler
trainer: NoneTrainer


## Training ------------------------------#
train:
  start_time: 2000/01/01
  end_time: 2000/12/31
  target: [y_var]
  optimizer:
    name: Adadelta
  lr: 1.0
  lr_scheduler:
    name: none
    step_size: 10
    gamma: 0.5
  loss_function:
    model: RmseLossComb

  batch_size: 100
  epochs: 50
  start_epoch: 0
  save_epoch: 5


## Evaluation -------------------------------#
test:
  start_time: 2001/01/01
  end_time: 2001/12/31
  batch_size: 100
  test_epoch: 1


## Inference -------------------------------#
sim:
  start_time: 2001/01/01
  end_time: 2001/12/31
  batch_size: 100


## Differentiable Model -----------------------------#
model:
  rho: 365
  warmup: 365
  output_unit: mm/d  # options: mm/d, m3/s, ft3/s

  phy:
    name: [NonePhyModel]
    # For physical models supporting the new integration interface.
    autograd_scheme: null  # null: standard PyTorch autograd, otherwise a custom scheme inside model/phy/autograd_schemes/
    solver:  # torchdiffeq.odeint keyword arguments
      method: euler
      rtol: 1.0e-4
      atol: 1.0e-6
      options: {step_size: 0.25}
    nmul: 16
    dy_drop: 0.0
    dynamic_params:
      NonePhyModel: [z1, z2]

    forcings: [
      x1_var,
      x2_var,
    ]
    attributes: [
      attr1,
      attr2,
    ]

  nn:
    name: Lstm
    dropout: 0.5
    hidden_size: 256

    forcings: [
      x1_var,
      x2_var,
    ]
    attributes: [
      attr1,
      attr2,
    ]
